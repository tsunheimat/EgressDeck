        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
  /v1/probes/node/{nodeId}:
    post:
      tags:
        - probes
      operationId: probeNodeAlias
      summary: Probe a node from its path ID
      description: Request bodies are ignored by this alias. URL, timeout, and transport probe options
        are not implemented. Missing target returns 400.
      x-required-capability: probe.node
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
  /v1/probes/group:
    post:
      tags:
        - probes
      operationId: probeGroup
      summary: Probe a group from its body ID
      description: Missing fake target returns 400. Fake probes are simulation only. Stock and native
        probes are unsupported.
      x-required-capability: probe.group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupProbeRequest'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
  /v1/probes/group/{groupId}:
    post:
      tags:
        - probes
      operationId: probeGroupAlias
      summary: Probe a group from its path ID
      description: Request bodies are ignored by this alias. URL, timeout, and transport probe options
        are not implemented. Missing target returns 400.
      x-required-capability: probe.group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
  /v1/connections:
    get:
      tags:
        - readback
      operationId: observeConnections
      summary: Read active connections
      description: Returns a bare array with no items or observed_at wrapper.
      x-required-capability: connections.observe
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
  /v1/connections/close:
    post:
      tags:
        - readback
      operationId: closeFilteredConnections
      summary: Close connections matching a flat filter
      description: Send the flat Go field names GroupID, ProviderID, NodeID, and Transport. A nested filter
        property and snake_case ID fields are rejected. An empty object matches all connections. Response
        contains only closed.
      x-required-capability: connections.close_filtered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionFilter'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionCloseResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
  /v1/counters:
    get:
      tags:
        - readback
      operationId: readTrafficCounters
      summary: Read proxy and direct traffic counters
      description: Both traffic.proxy_counters and traffic.direct_counters must be supported. Unsupported
        replies identify operation traffic.counters. No observation timestamp is emitted.
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counters'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
      x-required-capabilities:
        - traffic.proxy_counters
        - traffic.direct_counters
  /v1/events:
    get:
      tags:
        - readback
      operationId: resumeEvents
      summary: Read events after an event ID
      description: Returns a bare array of events whose IDs exceed after. Missing or malformed after values
        become zero; negative values are accepted. There is no next cursor wrapper, expiration, or HTTP
        410 response.
      x-required-capability: events.resume
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type: integer
            format: int64
            default: 0
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: TLS 1.3 with a verified controller client certificate.
    bearerAuth:
      type: http
      scheme: bearer
      description: The configured agent token. Authorization uses the literal Bearer scheme.
  parameters:
    MutationIDPath:
      name: mutationId
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.:-]{1,256}$'
    MutationIDHeader:
      name: X-EgressDeck-Mutation-ID
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.:-]{1,256}$'
      description: Exact controller operation ID; must equal mutationId on status/resolve routes. Supply all five identity headers once each or omit all on legacy mutations.
    MutationHashHeader:
      name: X-EgressDeck-Mutation-Hash
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
      description: Durable controller request hash, bound to the mutation ID and target.
    MutationTargetKindHeader:
      name: X-EgressDeck-Mutation-Target-Kind
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.:-]{1,64}$'
    MutationTargetIDHeader:
      name: X-EgressDeck-Mutation-Target-ID
      in: header
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_.:-]{1,256}$'
    MutationFenceHeader:
      name: X-EgressDeck-Mutation-Fence
      in: header
      required: true
      schema:
        type: string
        pattern: '^[1-9][0-9]*$'
      description: Positive uint64 fencing token in canonical decimal, without leading zeroes.
  responses:
    MutationReceiptResponse:
      description: Synchronous correlated mutation receipt; only committed or rejected establishes a terminal outcome.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MutationReceipt'
    BadRequest:
      description: Malformed JSON, unknown request field, invalid provider revision, or invalid/missing
        selection or probe target.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing or invalid Bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Staged revision not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MethodNotAllowed:
      description: Method is unsupported by this registered route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Gateway generation, stage base generation, or selection revision conflicts with current
        state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: Stock native policy validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Busy:
      description: Retained staging or native daemon inventory capacity is exhausted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Untyped engine or journal error. Current fake-engine empty-provider and policy-validation
        failures also map to 500.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unsupported:
      description: Engine operation is unsupported. Body includes error.code unsupported and error.operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Native daemon/socket or stock validation dependency is unavailable. Native error.code
        outcome_unknown also uses 503 and requires authoritative readback before further mutation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Identifier:
      type: string
      description: Opaque string. The agent does not enforce a character pattern or maximum length.
    Liveness:
      type: object
      required:
        - status
        - observed_at
      properties:
        status:
          type: string
          const: alive
        observed_at:
          type: string
          format: date-time
      additionalProperties: false
    Health:
      type: object
      description: Stock and native health report degraded when their observation succeeds, not traffic-ready.
        Native uses implementation dae-native-unix and reports unavailable when the protected daemon inventory
        cannot be read. Fake uses simulation. Concrete Health structs emit executable_available and process_observed
        (false for native/fake); the generic engine fallback may omit them.
      required:
        - status
        - implementation
        - observed_at
      properties:
        status:
          type: string
          enum:
            - unavailable
            - degraded
            - simulation
        implementation:
          type: string
        executable_available:
          type: boolean
        executable_sha256:
          type: string
        engine_version:
          type: string
        engine_pid:
          type: integer
          format: int64
        process_observed:
          type: boolean
        observed_at:
          type: string
          format: date-time
        details:
          type: array
          items:
            type: string
      additionalProperties: false
      x-go-type: gateway.Health
      x-source: internal/gateway/stock.go
    CapabilityName:
      type: string
      enum:
        - inventory.read
        - provider.stage
        - provider.publish_hot
        - group.publish_hot
        - selection.set_runtime
        - selection.persist_restart
        - policy.validate
        - policy.apply_generation
        - probe.node
        - probe.group
        - connections.observe
        - connections.close_filtered
        - traffic.proxy_counters
        - traffic.direct_counters
        - events.resume
    Capability:
      type: object
      required:
        - name
        - supported
      properties:
        name:
          $ref: '#/components/schemas/CapabilityName'
        supported:
          type: boolean
        implementation:
          type: string
        restrictions:
          type: array
          items:
            type: string
      additionalProperties: false
      x-go-type: gateway.Capability
      x-source: internal/gateway/engine.go
    Capabilities:
      type: object
      required:
        - implementation
        - version
        - capabilities
      properties:
        implementation:
          type: string
        version:
          type: string
          description: Native protocol version is v1. Fake uses its simulation version. Stock version
            is empty when executable version readback is unavailable.
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
      additionalProperties: false
      x-go-type: gateway.Capabilities
      x-source: internal/gateway/engine.go
    NodeInput:
      type: object
      required:
        - id
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        provider_id:
          type: string
          description: May be omitted in staging input; normalized to the enclosing provider ID.
        name:
          type: string
        identity:
          type: string
        definition_hash:
          type: string
        handle:
          type: integer
          minimum: 0
          description: Unsigned 64-bit runtime handle. Assigned on fake-engine publication.
        connection:
          type: string
          writeOnly: true
          description: Private native connection link, potentially containing credentials. Required and
            nonempty for each node in native staging. Accepted in flat and nested stage requests; never
            emitted in public snapshots or stage receipts.
      additionalProperties: true
      description: Private staging node. Input identity and definition_hash remain optional, while connection
        is a write-only native link.
      x-go-type: gateway.ProviderStageNode
      x-source: internal/gateway/wire.go
    Node:
      type: object
      required:
        - id
        - provider_id
        - name
        - handle
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        provider_id:
          type: string
          description: May be omitted in staging input; normalized to the enclosing provider ID.
        name:
          type: string
        identity:
          type: string
        definition_hash:
          type: string
        handle:
          type: integer
          minimum: 0
          description: Unsigned 64-bit runtime handle. Assigned on fake-engine publication.
      additionalProperties: false
      description: Public node JSON. connection is never serialized. Native snapshots also omit identity
        and definition_hash after clearing them in memory; fake snapshots may retain those optional fields.
      x-go-type: gateway.Node
      x-source: internal/gateway/engine.go
      x-public-filter: 'internal/gateway/native.go: snapshot clears Connection, Identity, DefinitionHash;
        Connection is always json:-'
    ProviderRevisionInput:
      type: object
      description: Nested private staging input. Omitted revision is zero. Fake staging allows an empty
        node list only with allow_empty true; native staging always requires nodes and exactly one publication
        group.
      required:
        - provider_id
      properties:
        provider_id:
          $ref: '#/components/schemas/Identifier'
        revision:
          type: integer
          format: int64
          minimum: 0
        content_hash:
          type: string
          description: An absent or empty staging hash is calculated from normalized nodes.
        nodes:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/NodeInput'
        allow_empty:
          type: boolean
          default: false
        groups:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/PublicationGroupInput'
      additionalProperties: true
    ProviderRevision:
      type: object
      required:
        - provider_id
        - revision
        - content_hash
        - nodes
      properties:
        provider_id:
          $ref: '#/components/schemas/Identifier'
        revision:
          type: integer
          format: int64
          minimum: 0
        content_hash:
          type: string
          description: An absent or empty staging hash is calculated from normalized nodes.
        nodes:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/Node'
        allow_empty:
          type: boolean
          default: false
        groups:
          type: array
          items:
            $ref: '#/components/schemas/PublicationGroup'
      additionalProperties: false
      description: Public provider revision. Native snapshots include a revision only when the daemon
        group identities match the retained provider and revision. Its content_hash is the supplied opaque
        receipt identity; the controller bridge sends providerID:revision instead of a credential-derived
        digest.
      x-go-type: gateway.ProviderRevision
      x-source: internal/gateway/engine.go
    StageProviderFlatRequest:
      type: object
      description: Flat private staging form. Omitted revision and expected_generation default to zero.
        Unknown fields are ignored; known flat fields must have their declared JSON types.
      required:
        - provider_id
      properties:
        provider_id:
          $ref: '#/components/schemas/Identifier'
        revision:
          type: integer
          format: int64
          minimum: 0
        content_hash:
          type: string
          description: An absent or empty staging hash is calculated from normalized nodes.
        nodes:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/NodeInput'
        allow_empty:
          type: boolean
          default: false
        expected_generation:
          type: integer
          format: int64
          default: 0
        groups:
          type:
            - array
            - 'null'
          items:
            $ref: '#/components/schemas/PublicationGroupInput'
      additionalProperties: true
      x-go-type: gateway.ProviderStageRequest
      x-source: internal/gateway/wire.go
    StageProviderNestedRequest:
      type: object
      required:
        - revision
      properties:
        revision:
          $ref: '#/components/schemas/ProviderRevisionInput'
        expected_generation:
          type: integer
          format: int64
          default: 0
      additionalProperties: true
      description: Nested private revision, with expected_generation read from the outer object. Connection
        and groups are supported inside revision just as in the flat form.
    StageProviderRequest:
      oneOf:
        - $ref: '#/components/schemas/StageProviderFlatRequest'
        - $ref: '#/components/schemas/StageProviderNestedRequest'
    StagedProvider:
      type: object
      required:
        - stage_id
        - provider_id
        - revision
        - content_hash
        - base_generation
        - status
      properties:
        stage_id:
          $ref: '#/components/schemas/Identifier'
        provider_id:
          $ref: '#/components/schemas/Identifier'
        revision:
          type: integer
          format: int64
        content_hash:
          type: string
        base_generation:
          type: integer
          format: int64
        status:
          type: string
          const: staged
      additionalProperties: false
    PublishProviderRequest:
      type: object
      required:
        - stage_id
      properties:
        stage_id:
          $ref: '#/components/schemas/Identifier'
        expected_generation:
          type: integer
          format: int64
          description: Defaults to zero. Nonnegative values cause inventory preflight equality checking.
            Negative values skip that HTTP preflight; the fake engine still checks the stage base generation.
          default: 0
      additionalProperties: false
    PublicationResult:
      type: object
      description: The handler emits published even when the fake engine performs a no-op. No provider_id
        field is emitted.
      required:
        - status
        - snapshot
      properties:
        status:
          type: string
          const: published
        snapshot:
          $ref: '#/components/schemas/EngineSnapshot'
      additionalProperties: false
    SelectionScope:
      type: object
      required:
        - gateway_id
        - group_id
      properties:
        gateway_id:
          $ref: '#/components/schemas/Identifier'
          description: Emitted as a string, which may be empty for native inventory-created selections.
            Fake mutation requires a nonempty gateway ID; native mutation scopes by managed group.
        group_id:
          $ref: '#/components/schemas/Identifier'
        transport:
          type: string
          description: Native mutation accepts only both or empty because TCP and UDP share selection.
            Native inventory-created selections use both. The fake backend retains the exact supplied
            transport; empty and literal all remain distinct keys.
      additionalProperties: false
      x-go-type: gateway.SelectionScope
      x-source: internal/gateway/engine.go
    SelectionRequest:
      type: object
      required:
        - scope
        - desired_node_id
      properties:
        scope:
          $ref: '#/components/schemas/SelectionScopeInput'
        desired_node_id:
          $ref: '#/components/schemas/Identifier'
        expected_revision:
          type: integer
          format: int64
          default: 0
        persist_restart:
          type: boolean
          default: false
      additionalProperties: false
    AliasSelectionRequest:
      type: object
      required:
        - scope
        - node_id
      properties:
        scope:
          $ref: '#/components/schemas/SelectionScopeInput'
        node_id:
          $ref: '#/components/schemas/Identifier'
        expected_revision:
          type: integer
          format: int64
          default: 0
      additionalProperties: false
    Selection:
      type: object
      required:
        - scope
        - desired_node_id
        - observed_node_id
        - revision
        - updated_at
      properties:
        scope:
          $ref: '#/components/schemas/SelectionScope'
        desired_node_id:
          type: string
        observed_node_id:
          type: string
          description: Empty when a previously selected node disappears from publication.
        revision:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
      x-go-type: gateway.Selection
      x-source: internal/gateway/engine.go
    Policy:
      type: object
      required:
        - id
        - generation
      properties:
        id:
          type: string
          description: Empty in an initial snapshot before any policy is applied.
        generation:
          type: integer
          format: int64
        payload:
          description: Raw JSON. Stock validation requires an object containing only native_config, a
            nonempty standalone dae configuration string at most 1 MiB; include directives are rejected.
            Fake validation only checks ID and nonnegative generation.
      additionalProperties: false
      x-go-type: gateway.Policy
      x-source: internal/gateway/engine.go
    ApplyPolicyRequest:
      type: object
      required:
        - policy
      properties:
        policy:
          $ref: '#/components/schemas/Policy'
        expected_generation:
          type: integer
          format: int64
          default: 0
      additionalProperties: false
    ValidationResult:
      type: object
      required:
        - valid
      properties:
        valid:
          type: boolean
          const: true
      additionalProperties: false
    NodeProbeRequest:
      type: object
      required:
        - node_id
