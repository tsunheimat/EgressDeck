openapi: 3.1.0
info:
  title: EgressDeck Gateway Agent Contract
  version: 1.0.0
  summary: Implemented controller-to-gateway-agent HTTP protocol
  description: |-
    Describes the HTTP handlers in cmd/gateway-agent and the stock, native, and fake backends in internal/gateway. The default stock backend exposes executable/process health and optionally native policy validation. Its managed inventory, publication, selection, application, probes, connections, counters, and events remain unsupported. Explicit native mode connects to the patched daemon through a protected Unix socket and enables the capabilities listed under x-native-capabilities when inventory is reachable. Fake-engine success represents simulation only.

    On remote listeners, TLS 1.3 with verified client certificates and a bearer token are required together. Literal-loopback listeners may use plaintext; explicit development mode may disable the bearer token. Native HTTP routes start at /v1 with no /agent prefix.

    Mutation responses are synchronous. Idempotency-Key is not processed. Controller mutations carry the five X-EgressDeck-Mutation identity headers together, binding the durable request hash, target and fence to its controller operation. GET /v1/mutations/{mutationId} reads the correlated outcome; POST /v1/mutations/{mutationId}/resolve explicitly resolves it using durable agent/daemon evidence. Missing identity is supported for legacy mutation requests, but cannot provide correlated controller recovery. These routes return synchronous receipts, not asynchronous 202 jobs. An unchanged generation alone never clears pending intent; stock readback remains unsupported.

    Private staging requests may carry credential-bearing node connections. Public Node JSON excludes connection; native snapshot construction also clears identity and definition_hash. Native encrypted recovery state is removed from /v1/journal output.

    Most request decoders reject unknown fields. Staging uses a separate flat-or-nested decoder that ignores unknown fields. Omitted body integer fences default to zero; mutation identity fences are mandatory positive canonical decimal headers when identity is supplied. Errors contain an error field holding either a string or a typed object. A definite correlated preflight rejection also includes rejected_before_mutation and the matching mutation_identity. Generation and revision conflicts return HTTP 409; native outcome_unknown returns HTTP 503.
servers:
  - url: https://{gateway}
    description: Native remote agent listener; mTLS and bearer authentication are both required.
    variables:
      gateway:
        default: gateway.example.invalid:9090
security:
  - mutualTLS: []
    bearerAuth: []
tags:
  - name: discovery
    description: Agent liveness, health, and engine capabilities.
  - name: providers
    description: Staging and publication of provider revisions.
  - name: groups
    description: Independent outbound-group configuration publication.
  - name: selection
    description: Runtime and durable selection.
  - name: policy
    description: Policy validation and application.
  - name: probes
    description: Engine node and group probes.
  - name: readback
    description: Inventory, journal, connections, counters, and events.
  - name: mutations
    description: Correlated native mutation status and authoritative recovery.
x-stock-capabilities:
  description: Every known capability entry is returned. Only policy.validate can become supported,
    after executable availability and version readback succeed. All other entries remain false.
  conditionally-supported:
    - policy.validate
  always-unsupported:
    - inventory.read
    - provider.stage
    - provider.publish_hot
    - group.publish_hot
    - selection.set_runtime
    - selection.persist_restart
    - policy.apply_generation
    - probe.node
    - probe.group
    - connections.observe
    - connections.close_filtered
    - traffic.proxy_counters
    - traffic.direct_counters
    - events.resume
x-planned-operations:
  - method: GET
    path: /v1/operations/{operationId}
    status: planned-only
    description: Not registered on the gateway agent. Use /v1/mutations/{mutationId} for controller-correlated status and /v1/journal for public history. The private daemon has its own operation-ID protocol.
paths:
  /healthz:
    get:
      tags:
        - discovery
      operationId: readLiveness
      summary: Read process liveness
      description: No bearer token is required. On a TLS listener, client certificate verification still
        occurs during the TLS handshake before this route can be reached.
      security: []
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/health:
    get:
      tags:
        - discovery
      operationId: readHealth
      summary: Read engine executable and process health
      responses:
        '200':
          description: Health including unavailable or degraded status is returned with HTTP 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/capabilities:
    get:
      tags:
        - discovery
      operationId: discoverCapabilities
      summary: Read all known engine capabilities
      description: Returns every known capability. Stock supports only policy.validate conditionally.
        Native supports inventory.read, provider.stage, provider.publish_hot, group.publish_hot, selection.set_runtime, and
        selection.persist_restart only while daemon inventory is reachable. Fake entries describe simulation
        and include restrictions.
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /v1/inventory:
    get:
      tags:
        - readback
      operationId: readInventory
      summary: Read the current engine snapshot
      x-required-capability: inventory.read
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/readback:
    get:
      tags:
        - readback
      operationId: readGeneration
      summary: Read the current raw engine snapshot
      description: Exact handler alias of /v1/inventory. Query parameters, including generation, are ignored;
        historical generation selection is not implemented. Stock returns 501 with operation inventory.read.
      x-required-capability: inventory.read
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/journal:
    get:
      tags:
        - readback
      operationId: readJournal
      summary: Read operation journal entries
      description: Returns a bare JSON array. With no journal configured the result is []; an empty or
        missing ordinary file journal may produce null. Native mode requires its durable journal. Public
        output strips state from native.state entries, including encrypted recovery material; status and
        lifecycle metadata remain visible. Correlated status is available separately at /v1/mutations/{mutationId}.
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                type:
                  - array
                  - 'null'
                items:
                  $ref: '#/components/schemas/JournalEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/mutations/{mutationId}:
    parameters:
      - $ref: '#/components/parameters/MutationIDPath'
      - $ref: '#/components/parameters/MutationIDHeader'
      - $ref: '#/components/parameters/MutationHashHeader'
      - $ref: '#/components/parameters/MutationTargetKindHeader'
      - $ref: '#/components/parameters/MutationTargetIDHeader'
      - $ref: '#/components/parameters/MutationFenceHeader'
    get:
      tags:
        - mutations
      operationId: readMutationStatus
      summary: Read the authoritative status of a correlated mutation
      description: Read-only lookup. The complete authenticated identity must match the path and retained request. Absence or an unchanged generation is not proof of rejection. Stock and fake engines may return unsupported when they do not implement this interface.
      responses:
        '200':
          $ref: '#/components/responses/MutationReceiptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/mutations/{mutationId}/resolve:
    parameters:
      - $ref: '#/components/parameters/MutationIDPath'
      - $ref: '#/components/parameters/MutationIDHeader'
      - $ref: '#/components/parameters/MutationHashHeader'
      - $ref: '#/components/parameters/MutationTargetKindHeader'
      - $ref: '#/components/parameters/MutationTargetIDHeader'
      - $ref: '#/components/parameters/MutationFenceHeader'
    post:
      tags:
        - mutations
      operationId: resolveMutation
      summary: Resolve a correlated mutation using durable native evidence
      description: Explicit recovery action. May settle an operation only when the durable agent/daemon protocol establishes its outcome and prevents delayed execution. It never releases pending intent solely because inventory generation is unchanged. No request body is required.
      responses:
        '200':
          $ref: '#/components/responses/MutationReceiptResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/groups/publish:
    post:
      tags:
        - groups
      operationId: publishOutboundGroup
      summary: Publish one group's configuration against an unchanged active provider
      x-required-capability: group.publish_hot
      description: Validates the exact active provider revision, expected gateway generation, advancing group revision and selected candidate. Native publication uses an existing manual group binding and retains provider connection definitions; groups spanning providers are unsupported. Successful response includes fresh matching inventory. Uncertain acknowledgement or readback returns outcome_unknown; definite preflight rejection does not claim a remote mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupPublishRequest'
      responses:
        '200':
          description: Group published and read back
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Invalid provider/group revision or selected candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/Busy'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/providers/stage:
    post:
      tags:
        - providers
      operationId: stageProviderRevision
      summary: Stage an immutable provider revision
      description: |-
        Both flat and nested private revision forms are accepted, including nodes[].connection and groups[]. Staging retains active state and returns a synchronous receipt with an opaque stage_id.

        Fake staging checks expected_generation, normalizes missing node provider IDs and content hash, and accepts empty nodes only with allow_empty. Native staging requires a nonnegative expected generation matching daemon inventory, nonempty nodes with private connection links, exactly one predeclared group, distinct group candidates belonging to those nodes, and a selected candidate. The provider ID cannot contain a slash. Native revisions must advance active state and must not regress or change an already-staged immutable revision; total retained staging is bounded at 64 and the encoded native publication at 1 MiB.

        Native private requests are retained in encrypted recovery state. Public stage receipts contain no node links. Empty native provider revisions still return HTTP 500. Idempotency-Key is not used; native exact same-revision staging can reuse its receipt independently of that header.
      x-required-capability: provider.stage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageProviderRequest'
      responses:
        '201':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagedProvider'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/Busy'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/providers/publish:
    post:
      tags:
        - providers
      operationId: publishProviderRevision
      summary: Publish a staged provider revision
      description: |-
        Nonnegative expected_generation performs inventory preflight. Stock therefore normally rejects with 501 operation inventory.read before publication. Negative values skip only the HTTP preflight; engine staging-generation rules still apply.

        Native publication persists pending intent, submits a conditional daemon mutation, and requires fresh daemon identity/generation readback. Unresolved acknowledgement or readback returns 503 with error.code outcome_unknown, and the pending intent prevents replay until reconciled. Typed rejection can return 400 invalid_request, 409 conflict, or 429 busy. Successful response always says published, including fake no-ops. Probe/drain options are not accepted. The providerId path alias is ignored by the handler; stage_id selects the revision.
      x-required-capability: provider.publish_hot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishProviderRequest'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/Busy'
  /v1/providers/{providerId}/publish:
    post:
      tags:
        - providers
      operationId: publishProviderRevisionAlias
      summary: Publish a staged provider revision
      description: |-
        Nonnegative expected_generation performs inventory preflight. Stock therefore normally rejects with 501 operation inventory.read before publication. Negative values skip only the HTTP preflight; engine staging-generation rules still apply.

        Native publication persists pending intent, submits a conditional daemon mutation, and requires fresh daemon identity/generation readback. Unresolved acknowledgement or readback returns 503 with error.code outcome_unknown, and the pending intent prevents replay until reconciled. Typed rejection can return 400 invalid_request, 409 conflict, or 429 busy. Successful response always says published, including fake no-ops. Probe/drain options are not accepted. The providerId path alias is ignored by the handler; stage_id selects the revision.
      x-required-capability: provider.publish_hot
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Identifier'
          description: Routing parameter ignored by the handler; stage_id selects the revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishProviderRequest'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/Busy'
  /v1/selections:
    put:
      tags:
        - selection
      operationId: setSelection
      summary: Set runtime or durable outbound selection
      description: 'persist_restart false calls SetRuntimeSelection; true calls PersistSelection. Fake
        checks the selected capability independently. Native supports both through its durable daemon
        mutation, with a shared TCP/UDP selection: transport must be both or empty. Native unknown outcomes
        return 503 and retain pending intent. Revision conflicts return 409 and missing/invalid candidates
        return 400. Existing sessions are not explicitly closed.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectionRequest'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/Busy'
  /v1/selections/runtime:
    post:
      tags:
        - selection
      operationId: setRuntimeSelectionPost
      summary: Set runtime selection through the node_id alias
      description: This alias accepts node_id instead of desired_node_id. Both POST and PUT invoke the
        same handler. Native mode accepts transport both or empty and shares the selection between TCP
        and UDP; unresolved outcomes return 503 and retain pending intent.
      x-required-capability: selection.set_runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasSelectionRequest'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/Busy'
    put:
      tags:
        - selection
      operationId: setRuntimeSelectionPut
      summary: Set runtime selection through the node_id alias
      description: This alias accepts node_id instead of desired_node_id. Both POST and PUT invoke the
        same handler. Native mode accepts transport both or empty and shares the selection between TCP
        and UDP; unresolved outcomes return 503 and retain pending intent.
      x-required-capability: selection.set_runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasSelectionRequest'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/Busy'
  /v1/selections/persist:
    post:
      tags:
        - selection
      operationId: setPersistSelectionPost
      summary: Set persist selection through the node_id alias
      description: This alias accepts node_id instead of desired_node_id. Both POST and PUT invoke the
        same handler. Native mode accepts transport both or empty and shares the selection between TCP
        and UDP; unresolved outcomes return 503 and retain pending intent.
      x-required-capability: selection.persist_restart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasSelectionRequest'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/Busy'
    put:
      tags:
        - selection
      operationId: setPersistSelectionPut
      summary: Set persist selection through the node_id alias
      description: This alias accepts node_id instead of desired_node_id. Both POST and PUT invoke the
        same handler. Native mode accepts transport both or empty and shares the selection between TCP
        and UDP; unresolved outcomes return 503 and retain pending intent.
      x-required-capability: selection.persist_restart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AliasSelectionRequest'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Selection'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        '429':
          $ref: '#/components/responses/Busy'
  /v1/policies/validate:
    post:
      tags:
        - policy
      operationId: validatePolicy
      summary: Validate a policy without applying it
      description: Success is only {valid:true}. Stock accepts standalone payload.native_config and invokes
        dae validate --config; invalid native input returns 422. Fake missing ID or negative generation
        currently returns 500. Native backend policy validation is unsupported. No daemon mutation occurs.
      x-required-capability: policy.validate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/policies/apply:
    post:
      tags:
        - policy
      operationId: applyPolicyGeneration
      summary: Apply a policy generation
      description: Returns the raw EngineSnapshot synchronously. Fake application checks expected_generation
        against the gateway counter, increments that counter, and stores the independent submitted policy.generation.
        Stock and native policy application are unsupported.
      x-required-capability: policy.apply_generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPolicyRequest'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/policy/validate:
    post:
      tags:
        - policy
      operationId: validatePolicyAlias
      summary: Validate a policy without applying it
      description: Success is only {valid:true}. Stock accepts standalone payload.native_config and invokes
        dae validate --config; invalid native input returns 422. Fake missing ID or negative generation
        currently returns 500. Native backend policy validation is unsupported. No daemon mutation occurs.
      x-required-capability: policy.validate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Policy'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/policy/apply:
    post:
      tags:
        - policy
      operationId: applyPolicyGenerationAlias
      summary: Apply a policy generation
      description: Returns the raw EngineSnapshot synchronously. Fake application checks expected_generation
        against the gateway counter, increments that counter, and stores the independent submitted policy.generation.
        Stock and native policy application are unsupported.
      x-required-capability: policy.apply_generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyPolicyRequest'
      responses:
        '200':
          description: Synchronous result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngineSnapshot'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/Unsupported'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/probes/node:
    post:
      tags:
        - probes
      operationId: probeNode
      summary: Probe a node from its body ID
      description: Missing fake target returns 400. Fake probes are simulation only. Stock and native
        probes are unsupported.
      x-required-capability: probe.node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeProbeRequest'
