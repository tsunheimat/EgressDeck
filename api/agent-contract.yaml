x-native-capabilities:
  implementation: dae-native-unix
  version: v1
  conditionally-supported:
    - inventory.read
    - provider.stage
    - provider.publish_hot
    - group.publish_hot
    - selection.set_runtime
    - selection.persist_restart
  always-unsupported:
    - policy.validate
    - policy.apply_generation
    - probe.node
    - probe.group
    - connections.observe
    - connections.close_filtered
    - traffic.proxy_counters
    - traffic.direct_counters
    - events.resume
  description: All supported flags depend on successful native inventory readback. Provider publication requires
    exactly one predeclared group per staged provider, private native node links, and the encrypted agent
    journal. Independent group publication uses an unchanged active provider revision and an advancing group
    configuration revision; the selected node must remain eligible. Runtime selection is shared by TCP and UDP;
    transport must be both or empty. Persistence
    requires retained daemon and agent encryption keys and unchanged predeclared group layout. Capability
    discovery and degraded health do not establish privileged packet-path or eBPF acceptance.
