components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: egressdeck_session
      description: HTTP-only session; mutations also require X-CSRF-Token matching egressdeck_csrf.
  headers:
    SetCookie:
      description: Session and CSRF cookies
      schema:
        type: string
  parameters:
    ResourceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Expected positive resource revision, optionally quoted. Current mutating handlers require this
        header or the revision query; missing or invalid input returns 428.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Optional controller journal key. Reuse only for the same action/payload. No HTTP-layer replay
        guarantee is provided by the gateway agent.
    Revision:
      name: revision
      in: query
      required: false
      schema:
        type: integer
        format: int64
        minimum: 1
      description: Alternative to If-Match; one positive expected revision is required.
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
      description: Required with a session in session/header mode. Must match egressdeck_csrf cookie and session
        token.
    RuntimeIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: Expected nonnegative selection/active-provider revision, optionally quoted. Use 0 for first selection/publication.
        Missing or invalid header returns 428; no query fallback.
    CollectionLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    CollectionCursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 2048
      description: Opaque next_cursor from prior page. Bound to route, query, limit and stable snapshot. Restart
        invalidates cursors; expiry is 15 minutes.
  responses:
    NotImplemented:
      description: Adapter capability is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnsupportedResponse'
    Error401:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error403:
      description: Forbidden or CSRF failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error412:
      description: Revision conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error422:
      description: Semantic validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error503:
      description: Dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
    ReadyResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ready
    Role:
      type: string
      enum:
      - viewer
      - operator
      - admin
    LoginResponse:
      type: object
      required:
      - subject
      - roles
      - expires_at
      properties:
        subject:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        expires_at:
          type: string
          format: date-time
    Session:
      type: object
      required:
      - subject
      - roles
      properties:
        subject:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        expires_at:
          type: string
          format: date-time
        auth_mode:
          type: string
        authentication_disabled:
          type: boolean
    ErrorDetail:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        capability:
          type: string
    ErrorResponse:
      oneOf:
      - type: object
        required:
        - error
        properties:
          error:
            $ref: '#/components/schemas/ErrorDetail'
      - type: object
        required:
        - error
        - message
        properties:
          error:
            type: string
          message:
            type: string
    UnsupportedResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - unsupported_capability
            message:
              type: string
            capability:
              type: string
          additionalProperties: false
          required:
          - code
          - message
          - capability
      additionalProperties: false
      required:
      - error
    ControllerCapabilities:
      type: object
      required:
      - api_version
      - capabilities
      properties:
        api_version:
          type: string
        capabilities:
          type: object
          additionalProperties:
            type: boolean
    DeviceAddress:
