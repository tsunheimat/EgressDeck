        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
      x-implementation-status: implemented
      description: Returns provider lifecycle and cached firewall projections. Missing firewall counts/drift mean
        unknown; observed_at and observation_status distinguish fresh, stale, error or never_read. coverage is null
        with coverage_status=unavailable.
      x-required-role: viewer
