openapi: 3.0.3
info:
  title: EgressDeck Controller HTTP API
  version: 0.1.0
  description: Current Go HTTP contract. Snake_case wire values are mapped by the Vue client into UI summaries.
    Collection pages use items, limit, total and optional next_cursor; the durable event feed uses its own resume
    cursor. Conditional remote adapter routes return typed HTTP 501 when unavailable. A 202 identifies an existing
    controller journal entry and is separate from applied, observed and traffic-verified state. Roadmap-only operations
    are outside paths under x-planned-operations; OIDC callback registration follows exact OIDC_REDIRECT_URL under
    x-oidc-callback.
servers:
- url: /
security:
- sessionCookie: []
tags:
- name: health
  description: Process checks
- name: auth
  description: OIDC and application sessions
- name: inventory
  description: Device and group intent
- name: providers
  description: Provider and node lifecycle
- name: policy
  description: Typed policy and outbound groups
- name: gateways
  description: Gateway and firewall observation
- name: operations
  description: Durable operations and diagnostics
x-planned-operations:
- path: /api/v1/deployments
  method: POST
  reason: Use /api/v1/operations or /api/v1/deployments/enrollment for registered handlers.
  x-implementation-status: planned-only
- path: /api/v1/nodes/{id}
  method: GET
  reason: Only the collection route is registered.
  x-implementation-status: planned-only
- path: /api/v1/gateways/{id}
  method: PATCH
  reason: Current member route is GET only.
  x-implementation-status: planned-only
- path: /api/v1/firewall-bindings/{id}
  method: PATCH
  reason: Current member route is GET only.
  x-implementation-status: planned-only
- path: /api/v1/policies/{id}/explain
  method: POST
  x-implementation-status: planned-only
  reason: Implemented explain uses /api/v1/policies/explain with manifest and packet.
paths:
  /healthz:
    get:
      tags:
      - health
      summary: Read process liveness
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      x-implementation-status: implemented
  /readyz:
    get:
      tags:
      - health
      summary: Read store readiness
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          $ref: '#/components/responses/Error503'
      x-implementation-status: implemented
  /api/v1/auth/oidc/login:
    get:
      tags:
      - auth
      summary: Start configured OIDC login
      operationId: startOIDCLogin
      security: []
      x-implementation-status: configured-auth-mode
      responses:
        '302':
          description: Identity provider redirect
        '404':
          description: Route is not registered outside AUTH_MODE=session
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Create a session from signed identity headers
      operationId: loginSignedHeaders
      description: AUTH_MODE=header only. Subject and role come from HMAC-authenticated X-Auth-Request-* headers;
        JSON subject/role is not accepted as authority.
      security: []
      x-implementation-status: configured-auth-mode
      parameters:
      - name: X-Auth-Request-User
        in: header
        required: true
        schema:
          type: string
      - name: X-Auth-Request-Role
        in: header
        required: true
        schema:
          type: string
        description: Signed role claim. viewer/operator/admin are canonical; administrator is accepted as admin.
          An unknown authenticated role falls back to viewer.
      - name: X-Auth-Request-Signature
        in: header
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Session created
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Error401'
  /api/v1/auth/session:
    get:
      tags:
      - auth
      summary: Read current application session
      operationId: getSession
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
      x-implementation-status: implemented
      x-required-role: viewer
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      summary: Clear the session
      operationId: logout
      responses:
        '204':
          description: Session cleared
        '403':
          $ref: '#/components/responses/Error403'
        '401':
          $ref: '#/components/responses/Error401'
      x-implementation-status: implemented
      parameters:
      - $ref: '#/components/parameters/CSRF'
      x-required-role: viewer
  /api/v1/capabilities:
    get:
      tags:
      - gateways
      summary: Read configured controller capabilities
      operationId: getCapabilities
      responses:
        '200':
          description: Capability flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllerCapabilities'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
      x-implementation-status: implemented
      description: Controller flags describe configured service availability. events.resume=true reflects the local
        persisted polling feed. Diagnostics still read live gateway capabilities on each request. policy.apply_generation
        is an explicit qualification flag; the presence of an executor alone does not enable it. Provider/selection
        flags do not establish real-network acceptance.
      x-required-role: viewer
  /api/v1/overview:
    get:
