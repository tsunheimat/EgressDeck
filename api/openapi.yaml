        '403':
          $ref: '#/components/responses/Error403'
        '400':
          description: invalid_cursor or invalid query/limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'stale_cursor: snapshot changed or cursor expired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: collection_item_too_large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: collection_capacity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implementation-status: implemented
      description: Returns a bounded items page with limit, total and optional next_cursor. Default limit 100, maximum
        500. Follow next_cursor using the same query and limit. Snapshot change or expiry returns 409; restart invalidates
        the cursor. Responses are bounded to 4 MiB, scan to 100000 items/64 MiB; live observation values can refresh
        between pages.
