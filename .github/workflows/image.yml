name: Controller image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'apps/web/**'
      - 'deploy/compose/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/image.yml'
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'apps/web/**'
      - 'deploy/compose/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and inspect image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: controller
            dockerfile: deploy/compose/Dockerfile
          - name: web
            dockerfile: deploy/compose/Dockerfile.web
          - name: gateway-agent
            dockerfile: deploy/compose/Dockerfile.gateway-agent
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image.name }}
          tags: |
            type=sha
            type=semver,pattern={{version}}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name != 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name == 'push' }}
          sbom: ${{ github.event_name == 'push' }}

      - name: Validate compose configuration
        env:
          SESSION_SECRET: controller_ci_session_secret_0123456789abcdef
          APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          GATEWAY_AGENT_TOKEN: controller_ci_agent_token
        run: docker compose -f deploy/compose/compose.yaml config --quiet
