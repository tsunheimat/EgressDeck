name: Contract and schema

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.redocly.yaml'
      - 'migrations/**'
      - 'tests/contract/**'
      - 'tests/fixtures/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/contract.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.redocly.yaml'
      - 'migrations/**'
      - 'tests/contract/**'
      - 'tests/fixtures/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/contract.yml'

permissions:
  contents: read

concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: API and fixture contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run contract tests
        run: go test -count=1 ./tests/contract

      - name: Validate OpenAPI document
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint OpenAPI documents
        run: |
          npx --yes @redocly/cli@1.34.2 lint --config .redocly.yaml api/openapi.yaml
          npx --yes @redocly/cli@1.34.2 lint --config .redocly.yaml api/agent-contract.yaml

  postgres:
    name: Idempotent PostgreSQL schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: controller_ci
          POSTGRES_PASSWORD: controller_ci_password
          POSTGRES_DB: controller_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U controller_ci -d controller_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client

      - name: Apply schema twice
        env:
          PGPASSWORD: controller_ci_password
        run: |
          set -euo pipefail
          for run in 1 2; do
            psql --host=127.0.0.1 --port=5432 --username=controller_ci --dbname=controller_ci \
              --set=ON_ERROR_STOP=1 --file=migrations/schema.sql
          done

      - name: Check required tables and constraints
        env:
          PGPASSWORD: controller_ci_password
        run: |
          set -euo pipefail
          tables="$(psql --no-align --tuples-only --host=127.0.0.1 --port=5432 \
            --username=controller_ci --dbname=controller_ci \
            --command="SELECT string_agg(table_name, ',' ORDER BY table_name) FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('devices','device_groups','providers','provider_revisions','nodes','node_revisions','outbound_groups','policies','rule_sets','rules','firewall_bindings','deployments','operations','audit_events');")"
          test "$tables" = "audit_events,deployments,device_groups,devices,firewall_bindings,node_revisions,nodes,operations,outbound_groups,policies,provider_revisions,providers,rule_sets,rules" \
            || { echo "required table set mismatch: $tables"; exit 1; }

      - name: Exercise PostgreSQL controller lifecycle and restart
        env:
          TEST_DATABASE_URL: postgres://controller_ci:controller_ci_password@127.0.0.1:5432/controller_ci?sslmode=disable
        run: go test -race -count=1 -v ./tests/integration

      - name: Run PostgreSQL adapter integration
        env:
          TEST_DATABASE_URL: postgres://controller_ci:controller_ci_password@127.0.0.1:5432/controller_ci?sslmode=disable
        run: go test -race -count=1 ./internal/store -run '^TestPostgresIntegration$'
