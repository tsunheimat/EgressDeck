# Example only. Do not apply this file with the placeholder value.
# Create the real secret out-of-band:
#
#   kubectl -n egressdeck-system create secret generic controller-secret \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 48)"
#
apiVersion: v1
kind: Secret
metadata:
  name: controller-secret
type: Opaque
stringData:
  SESSION_SECRET: replace-me-with-a-random-secret
  APP_ENCRYPTION_KEY: replace-with-base64-encoding-of-32-random-bytes
  OIDC_ISSUER_URL: https://identity.example.invalid/application/o/egressdeck/
  OIDC_CLIENT_ID: replace-with-client-id
  OIDC_CLIENT_SECRET: replace-with-client-secret
  OIDC_REDIRECT_URL: https://controller.example.invalid/api/v1/auth/callback
  # Optional with the operator overlay; remove keys for unused integrations.
  # PROVIDER_FETCH_CONFIG_FILE: /run/egressdeck/operator/provider-fetch.json
  # OPNSENSE_CONFIG_FILE: /run/egressdeck/operator/opnsense.json
  # CONTROLLER_GATEWAYS_FILE: /run/egressdeck/operator/gateways.json
